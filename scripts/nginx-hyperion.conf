# YOUR-DOMAIN.example.com
#
# Routes:
#   GET  /                    → static landing page (/var/www/a-chain-testnet/index.html)
#   *    /ext/*               → metalgo on 127.0.0.1:9650 (info + per-chain JSON-RPC)
#   *    /v1/*  /v2/*         → Hyperion API on 127.0.0.1:7000 (REST + WS)
#   *    everything else      → Hyperion (explorer UI, socket.io, /static, etc.)

# ------------------------------ HTTPS vhost ----------------------------------
server {
    server_name YOUR-DOMAIN.example.com;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl;                  # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/YOUR-DOMAIN.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-DOMAIN.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Basic hardening
    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Landing page (static; lists what's available + curl examples)
    root /var/www/a-chain-testnet;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # MetalGo endpoints — node info, P-Chain, X-Chain, C-Chain, and the Pulse subnet RPC.
    # The Pulse JSON-RPC lives at /ext/bc/<blockchainID>/rpc.
    #
    # Sensitive metalgo APIs are denied at this layer even though they're
    # disabled-by-default in metalgo config — defense in depth.
    location ~ ^/ext/(admin|keystore|auth)(/|$) {
        return 403;
    }

    location /ext/ {
        proxy_pass http://127.0.0.1:9650;
        proxy_http_version 1.1;
        # metalgo enforces http-allowed-hosts (defaults to localhost). Override
        # the Host header so the upstream doesn't reject the proxied request.
        proxy_set_header Host "localhost";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Hyperion REST API (v1 compat + v2 native).
    location ~ ^/(v1|v2)/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else falls through to Hyperion (explorer UI, socket.io, /docs, etc.)
    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------ HTTP → HTTPS redirect ------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.example.com;

    if ($host = YOUR-DOMAIN.example.com) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
